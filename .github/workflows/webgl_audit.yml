name: WebGL Portfolio Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate HTML5 Syntax
      run: |
        echo "Validating index.html semantic landmarks and markup integrity..."
        test -f index.html
        test -f 404.html
    - name: Verify WebGL Shader Assets
      run: |
        test -d src/shaders
        echo "All GLSL shader components verified."
